[package]
name = "chaos-desktop"
description = "Tauri shell embedding the chaos web frontend (desktop + mobile)"
version.workspace = true
edition.workspace = true

# Tauri's Android target builds this crate as a library.
[lib]
name = "chaos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chaos-desktop"
path = "src/main.rs"

[dependencies]
tauri.workspace = true
tauri-plugin-http.workspace = true
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url.workspace = true

# The single-instance plugin has no mobile implementation.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build.workspace = true
