# Release: runs when a semver tag (v*) is pushed from main and publishes the
# GitHub Release and generated notes. NixOS deployments consume the tagged
# flake directly, so CI does not build or upload duplicate server/web archives.
# The signed Android APK can still be attached locally with `just release-apk`;
# its keystore never leaves the development machine.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The flake reads its version from Cargo.toml, so one check covers both.
      - name: Check tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$cargo_version"
          test "$tag" = "$cargo_version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Deploying

            NixOS hosts consume the tagged flake directly (this is what the
            zeus module does):

            ```bash
            nix build github:tdbmxyz/chaos/${{ github.ref_name }}#chaos-server
            ```
